name: Database backup

# Free-tier Supabase has no reliable automatic backups (and idle free projects can be
# paused/deleted), so we take our own. Dumps the public tables daily and keeps each dump
# as a workflow artifact for 90 days. Dumps are NEVER committed to this public repo.
#
# Required secret (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_DB_URL — the full Postgres connection string for the project, e.g.
#     postgresql://postgres:<PASSWORD>@db.hqrqmkherwdkfvhjypuk.supabase.co:5432/postgres
#   Find it in Supabase → Project Settings → Database → Connection string (URI).
#   This grants full DB access — keep it ONLY in Actions secrets, never in the repo.
# The workflow no-ops with a clear message until that secret is set.

on:
  schedule:
    - cron: '17 3 * * *'   # daily at 03:17 UTC
  workflow_dispatch:        # allow manual runs

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret is present
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. Add it in Settings → Secrets and variables → Actions. See backup.yml header."
            exit 1
          fi

      - name: Install PostgreSQL 17 client
        # pg_dump refuses to dump a server newer than itself, and the runner's
        # preinstalled client (16) lags Supabase's server (17). Install the matching
        # major from PGDG and call its binary by explicit path (the PATH `pg_dump`
        # wrapper resolves to the older preinstalled version).
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump public tables
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          OUT="leaderboard-backup-${STAMP}.sql"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-privileges \
            -t public.athletes -t public.profiles -t public.proposals \
            -f "$OUT"
          gzip "$OUT"
          ls -lh "${OUT}.gz"
          echo "DUMP_FILE=${OUT}.gz" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DUMP_FILE }}
          path: ${{ env.DUMP_FILE }}
          retention-days: 90
          if-no-files-found: error
