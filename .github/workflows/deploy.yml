name: Deploy to GitHub Pages

# Publishes the static site on every push to main.
# No build step — stage public assets after the regression suite passes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Stage public assets
        run: |
          mkdir -p "$RUNNER_TEMP/leaderboard-site"
          cp index.html styles.css favicon.svg apple-touch-icon.png "$RUNNER_TEMP/leaderboard-site/"
          cp -R js "$RUNNER_TEMP/leaderboard-site/js"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/leaderboard-site
      - id: deployment
        uses: actions/deploy-pages@v5
